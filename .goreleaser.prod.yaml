version: 2

builds:
  - id: deploy-crate
    main: ./cmd/app
    binary: deploy-crate
    env:
      - CGO_ENABLED=0
    goos:
      - linux
    goarch:
      - amd64
    ldflags:
      - -s -w
      - -X main.appVersion={{.Version}}

archives:
  - id: deploy-crate
    name_template: "{{ .ProjectName }}_{{ .Os }}_{{ .Arch }}"
    formats:
      - binary

release:
  make_latest: true

changelog:
  disable: true
