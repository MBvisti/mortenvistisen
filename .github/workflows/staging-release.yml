name: Staging Release

on:
  push:
    branches:
      - master

permissions:
  contents: read

env:
  GO_VERSION: '1.26.0'

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}

      - name: Configure git
        run: |
          git config user.email "github-actions@mbvlabs.com"
          git config user.name "MBV (GA)"

      - name: Update staging tag
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release delete 0.0.0-staging --yes --cleanup-tag 2>/dev/null || true
          git tag -f 0.0.0-staging
          git push -f origin 0.0.0-staging

      - name: Install GoReleaser
        uses: goreleaser/goreleaser-action@v6
        with:
          install-only: true
          version: v2.7.0

      - name: Run GoReleaser
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GORELEASER_CURRENT_TAG: "0.0.0-staging"
        run: goreleaser release --clean --skip=validate
